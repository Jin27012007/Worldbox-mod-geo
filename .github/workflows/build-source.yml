name: Build source mod
on:
  push:
    branches: [scaffold/observatorio-dos-reinos]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Mono compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel
      - name: Locate reference assemblies
        id: refs
        shell: bash
        run: |
          find . -type f \\( -iname 'Assembly-CSharp-Publicized.dll' -o -iname 'Assembly-CSharp.dll' -o -iname 'NeoModLoader.dll' -o -iname '0Harmony.dll' -o -iname 'UnityEngine.dll' -o -iname 'UnityEngine.CoreModule.dll' -o -iname 'UnityEngine.UI.dll' -o -iname 'mscorlib.dll' \\) -print | sort > build-refs.txt
          cat build-refs.txt
          echo "count=$(wc -l < build-refs.txt)" >> "$GITHUB_OUTPUT"
      - name: Compile mod against references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          mapfile -t refs < build-refs.txt
          if [ "${'$'}{#refs[@]}" -eq 0 ]; then
            echo "BLOCKED_MISSING_REFERENCE_ASSEMBLIES" > build/compile-status.txt
            echo "Nenhuma assembly de referência foi encontrada. Não é possível compilar C# do mod sem Unity, NeoModLoader e Assembly-CSharp." > build/NOT_COMPILED.txt
            exit 0
          fi
          args=()
          for f in "${'$'}{refs[@]}"; do args+=("-r:${'$'}f"); done
          if mcs -langversion:latest -target:library -out:build/ObservatorioDosReinos.dll "${'$'}{args[@]}" src/*.cs > build/compiler.log 2>&1; then
            echo "PASS" > build/compile-status.txt
          else
            echo "FAIL" > build/compile-status.txt
            cat build/compiler.log
            exit 1
          fi
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-build-results
          path: |
            build/
            build-refs.txt

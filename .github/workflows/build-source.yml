name: Build source mod
on:
  push:
    branches: [scaffold/observatorio-dos-reinos]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Mono compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel
      - name: Find reference assemblies
        shell: bash
        run: |
          find . -type f \\( -iname 'Assembly-CSharp-Publicized.dll' -o -iname 'Assembly-CSharp.dll' -o -iname 'NeoModLoader.dll' -o -iname 'UnityEngine.dll' -o -iname 'UnityEngine.CoreModule.dll' -o -iname 'UnityEngine.UI.dll' \\) -print > /tmp/refs.txt
          cat /tmp/refs.txt
      - name: Compile against available references when supplied
        shell: bash
        run: |
          set -o pipefail
          mapfile -t refs < /tmp/refs.txt
          mkdir -p build
          if [ "${'$'}{#refs[@]}" -eq 0 ]; then
            echo "No WorldBox/NeoModLoader reference assemblies are included. A standalone compile cannot resolve game APIs."
            echo "Compile_Status=BLOCKED_MISSING_REFERENCES" > build/compile-status.txt
            exit 0
          fi
          args=()
          for f in "${'$'}{refs[@]}"; do args+=("-r:${'$'}f"); done
          if mcs -langversion:latest -target:library -out:build/ObservatorioDosReinos.dll "${'$'}{args[@]}" src/*.cs 2>&1 | tee build/compiler.log; then
            echo "Compile_Status=PASS" > build/compile-status.txt
          else
            echo "Compile_Status=FAIL" > build/compile-status.txt
            exit 1
          fi
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-build-diagnostics
          path: build/

name: Build source mod
on:
  push:
    branches: [scaffold/observatorio-dos-reinos]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source-check:
    name: Compile source against isolated Unity/NML stubs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show preinstalled .NET SDK
        run: dotnet --info
      - name: Compile C# source and catch source-level errors
        run: dotnet build tests/CompileStubs.csproj --configuration Release --verbosity minimal
      - name: Compile against local real references when safely supplied
        shell: bash
        run: |
          mkdir -p build
          required=(references/NeoModLoader.dll references/Assembly-CSharp-Publicized.dll references/UnityEngine.dll references/UnityEngine.CoreModule.dll references/UnityEngine.UI.dll references/0Harmony.dll)
          missing=0
          for f in "${'$'}{required[@]}"; do
            if [ ! -f "${'$'}f" ]; then echo "Missing private reference: ${'$'}f"; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "SKIPPED_PRIVATE_REFERENCES_NOT_PRESENT" > build/real-reference-status.txt
            echo "Real-reference build skipped: reference DLLs are deliberately not tracked in this public repository. Use a private/local build environment to provide them." >> "$GITHUB_STEP_SUMMARY"
          else
            dotnet build tests/CompileWorldBoxRefs.csproj --configuration Release --verbosity minimal | tee build/real-reference-build.log
            echo "PASS" > build/real-reference-status.txt
          fi
      - name: Report limits
        if: always()
        run: |
          {
            echo '## Build interpretation'
            echo 'Stub-based compilation catches source syntax and internal typing errors.'
            echo 'A real-reference compile runs only if the exact local/private reference DLLs are present under references/.'
            echo 'No game/loader DLLs are committed to this public repository.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-build-results
          path: build/

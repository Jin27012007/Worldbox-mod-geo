name: Validate and build Observatorio
on:
  push:
    branches:
      - main
      - 'scaffold/**'
      - 'foundation/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'scaffold/**'
      - 'foundation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: Static validation and stub smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate manifest, project and locale files
        run: python3 scripts/validate_repository.py

      - name: Test reference and package pipeline helpers
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile all source modules against isolated Unity/NML stubs
        run: dotnet build tests/CompileStubs.csproj --configuration Release --verbosity minimal

      - name: Exercise the local political data model
        run: dotnet run --project tests/CompileStubs.csproj --configuration Release --no-build

      - name: Detect private game references
        id: references
        run: python3 scripts/check_references.py

      - name: Compile against the real WorldBox/NML references
        if: steps.references.outputs.available == 'true'
        run: dotnet build ObservatorioDosReinos.csproj --configuration Release --verbosity minimal

      - name: Build installable ZIP from the real DLL
        if: steps.references.outputs.available == 'true'
        run: python3 scripts/package_mod.py

      - name: Upload installable mod package
        if: success() && steps.references.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-dos-reinos
          path: dist/Observatorio-dos-Reinos-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Record the validation boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Validation interpretation'
            echo '- Static manifest/source checks and stub smoke tests are not a game runtime test.'
            if [ -f bin/Release/netstandard2.1/ObservatorioDosReinos.dll ]; then
              echo '- A real-reference DLL exists in the runner; compile and package steps were required to pass.'
              echo '- Successful compilation proves compatibility with the supplied references, not runtime UI behavior.'
            else
              echo '- No real-reference DLL was produced. The real build was skipped and no installable package was produced.'
            fi
            echo '- Never commit game/Unity/NeoModLoader/Harmony reference assemblies to this public repository.'
          } >> "$GITHUB_STEP_SUMMARY"

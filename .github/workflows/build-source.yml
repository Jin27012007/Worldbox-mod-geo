name: Build source mod
on:
  push:
    branches: [scaffold/observatorio-dos-reinos]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source-check:
    name: Compile source against isolated Unity/NML stubs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show preinstalled .NET SDK
        run: dotnet --info
      - name: Compile C# source and catch source-level errors
        run: dotnet build tests/CompileStubs.csproj --configuration Release --verbosity minimal
      - name: Report limits
        if: always()
        run: |
          {
            echo '## Build interpretation'
            echo 'This job checks source syntax and internal typing against isolated Unity/NeoModLoader stubs.'
            echo 'It is not an installable mod DLL and does not validate the exact game/Harmony runtime API.'
            echo 'A final mod build still requires private reference assemblies from WorldBox 0.51.4 + NeoModLoader.'
          } >> "$GITHUB_STEP_SUMMARY"

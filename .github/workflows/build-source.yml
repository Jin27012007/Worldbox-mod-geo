name: Build source mod
on:
  push:
    branches: [scaffold/observatorio-dos-reinos]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Mono compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel
      - name: Locate reference assemblies
        shell: bash
        run: |
          mkdir -p build
          find . -type f -iname '*.dll' -print | sort > build-refs.txt
          grep -Ei 'Assembly-CSharp(-Publicized)?|NeoModLoader|0Harmony|UnityEngine(\.CoreModule|\.UI)?' build-refs.txt || true
      - name: Compile mod against references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          grep -Ei 'Assembly-CSharp(-Publicized)?\.dll|Assembly-CSharp\.dll|NeoModLoader\.dll|UnityEngine\.dll|UnityEngine\.CoreModule\.dll|UnityEngine\.UI\.dll|0Harmony\.dll' build-refs.txt > build/refs.txt || true
          mapfile -t refs < build/refs.txt
          if [ "${'$'}{#refs[@]}" -lt 4 ]; then
            echo "BLOCKED_MISSING_REFERENCE_ASSEMBLIES" > build/compile-status.txt
            echo "As referências de Unity/WorldBox/NeoModLoader não estão presentes. Compilação independente válida não pode ocorrer sem elas." > build/NOT_COMPILED.txt
            exit 0
          fi
          args=()
          for f in "${'$'}{refs[@]}"; do args+=("-r:${'$'}f"); done
          if mcs -langversion:latest -target:library -out:build/ObservatorioDosReinos.dll "${'$'}{args[@]}" src/*.cs > build/compiler.log 2>&1; then
            echo "PASS" > build/compile-status.txt
          else
            echo "FAIL" > build/compile-status.txt
            cat build/compiler.log
            exit 1
          fi
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-build-results
          path: |
            build/
            build-refs.txt
